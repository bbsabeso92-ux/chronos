 {id:'gut',q:'ماذا لو لم تُخترع المطبعة المتحركة؟',o:['كان انتشار الكتب سيبقى أبطأ وأغلى.','وربما ظهر اختراع مشابه لاحقًا؛ فالطباعة بالحروف المتحركة عُرفت في شرق آسيا قبل ذلك.','وربما تأخرت حركات الإصلاح والعلم الحديث نسبيًا.']}];

function view(){const m=$('#main');if(TAB!=='map')return;const n=nearby();const h=`<canvas id="mp"></canvas><div class="tg" style="margin:6px 0">خريطة مبسّطة تقريبية — اضغط على حضارة لفتحها. الحضارات المضيئة كانت قائمة في ${fy(Y)}.</div><div class="grid">${n.map(row).join('')||'<div class="card tg">لا أحداث قريبة من هذه السنة — اسحب الزمن.</div>'}</div>${Y>2026?'<div class="wr">⚠ ما بعد 2026 سيناريوهات تخيلية وليست توقعات مؤكدة.</div>':''}`;if(!m._k||m._k!=='map'){m.innerHTML=h;m._k='map';mapInit()}else{m.querySelector('.grid').innerHTML=n.map(row).join('')}}
function tab(k){TAB=k;const m=$('#main');m._k=null;$('#tabs').innerHTML=[['map','🌍 العالم'],['my','🧩 لغز'],['wi','🧠 ماذا لو؟'],['fu','🚀 المستقبل']].map(t=>`<button class="${t[0]==k?'on':''}" data-a="t:${t[0]}">${t[1]}</button>`).join('');
 if(k=='map')view();else if(k=='my'){const q=MY[mi];m.innerHTML=`<div class="card"><b>${q.n}</b> — ما الحدث؟<div style="margin:8px 0">${q.c.slice(0,mc).map(c=>`<div class="st">${c}</div>`).join('')}</div>${mc<5&&!mdone?'<button data-a="clue">كشف دليل ('+mc+'/5)</button>':''}<div style="margin-top:10px">${q.o.map((o,i)=>`<button data-a="ans:${i}" style="margin:3px">${esc(o)}</button>`).join('')}</div><div id="mr"></div><div style="margin-top:8px"><button data-a="nm">لغز آخر ↻</button></div></div>`}
 else if(k=='wi')m.innerHTML=WI.map((w,i)=>`<div class="card"><div class="wr">⚠ سيناريو خيالي وليس تاريخًا مؤكدًا</div><b>${w.q}</b><div class="st"><b>الحدث الأصلي</b>${esc(EN.get(w.id).n)} (${fy(EN.get(w.id).y)})</div>${w.o.map((o,j)=>`<div class="st"><b>احتمال ${j+1}</b>${esc(o)}</div>`).join('')}<button data-a="o:${w.id}">افتح الحدث</button></div>`).join('');
 else m.innerHTML=`<div class="wr">⚠ هذا ليس توقعًا مؤكدًا: سيناريوهات تخيلية مبنية على اتجاهات وافتراضات.</div>${Object.keys(FU).map(y=>`<div class="card"><button data-a="jy:${y}">${fy(+y)}</button><p>${FU[y]}</p></div>`).join('')}`}
/* ===== entity drawer + connection engine ===== */
function open(id){const e=EN.get(id);if(!e)return;ES.add(id);persist();meter();const nb=[...(AJ.get(id)||[])].map(i=>EN.get(i)),chips=a=>a.map(x=>`<span class="ch" data-a="o:${x.id}">${TI[x.t]} ${esc(x.n)}</span>`).join('')||'<span class="tg">—</span>';let h=`<div style="display:flex"><b style="font-size:20px;color:var(--a);flex:1">${TI[e.t]} ${esc(e.n)}</b><button data-a="x">✕</button></div><div class="tg">${TN[e.t]} · ${e.y==e.y2?fy(e.y):fy(e.y)+' → '+fy(e.y2)}</div>`;
 if(e.t=='e'){const[w,y,a]=e.x.split('|'),pre=nb.filter(x=>x.t=='e'&&x.y<e.y);h+=`<div class="st"><b>① ماذا حدث؟</b>${esc(w)}</div><div class="st"><b>② من شارك؟</b>${chips(nb.filter(x=>x.t!='e'))}</div><div class="st"><b>③ لماذا حدث؟</b>${esc(y)}</div><div class="st"><b>④ ماذا تغيّر بعده؟</b>${esc(a)}</div><div class="st"><b>⑤ ما الذي أدى إليه؟</b>${pre.length?chips(pre):'<span class="tg">لا حدث سابق مسجّل هنا</span>'}</div><button data-a="jy:${e.y+10}">⏭ ماذا حدث بعد 10 سنوات؟</button> `}else h+=`<p>${esc(e.x)}</p>`;
 h+=`<button data-a="jy:${e.y}">⏳ انتقل إلى ${fy(e.y)}</button><h4>🔗 الروابط</h4>${svgNet(e,nb)}<div>${chips(nb)}</div>`;$('#dw').innerHTML=h;$('#dw').classList.add('o')}
function svgNet(e,nb){const n=nb.slice(0,10),r=82;return`<svg viewBox="0 0 320 230" style="width:100%"><g stroke="var(--a)" stroke-opacity=".4">${n.map((x,i)=>{const a=i/n.length*6.283;return`<line x1="160" y1="115" x2="${160+Math.cos(a)*r*1.5}" y2="${115+Math.sin(a)*r}"/>`}).join('')}</g>${n.map((x,i)=>{const a=i/n.length*6.283,X=160+Math.cos(a)*r*1.5,Z=115+Math.sin(a)*r;return`<g data-a="o:${x.id}" style="cursor:pointer"><circle cx="${X}" cy="${Z}" r="9" fill="${x.t=='e'?'#8b5cf6':x.t=='p'?'#e6b34a':'#4fd1e8'}"/><text x="${X}" y="${Z+22}" font-size="10" fill="#f6f1e6" text-anchor="middle">${esc(x.n.slice(0,12))}</text></g>`}).join('')}<circle cx="160" cy="115" r="14" fill="var(--a)"/></svg>`}
/* ===== search (text + year ranges + graph) ===== */
function parseN(s){return s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))}
function search(q){q=parseN(q.trim().toLowerCase());if(!q)return[];const nums=[...q.matchAll(/(\d{1,4})\s*(ق\.?\s*م|bc)?/g)].map(m=>m[2]?-+m[1]:+m[1]);let r=[];
 if(nums.length>=2){const[a,b]=[Math.min(nums[0],nums[1]),Math.max(nums[0],nums[1])],words=q.replace(/[\d\s]|ق\.?\s*م|bc|بين|و|من|إلى|الى/g,'');r=[...EN.values()].filter(e=>e.y>=a&&e.y<=b&&(!/حرب|معرك/.test(q)||/معرك|سقوط|فتح|حرب/.test(e.n))).sort((x,y)=>x.y-y.y)}
 else{const ex=[...EN.values()].find(e=>e.n.toLowerCase().includes(q));r=[...EN.values()].filter(e=>(e.n+e.x).toLowerCase().includes(q));if(ex)for(const i of AJ.get(ex.id)||[])if(!r.includes(EN.get(i)))r.push(EN.get(i))}return r.slice(0,25)}
/* ===== map ===== */
const CO={eu:[[-10,36],[-9,43],[0,50],[8,54],[10,59],[30,70],[60,70],[100,77],[140,72],[180,68],[170,60],[140,52],[130,42],[122,30],[110,20],[105,10],[100,2],[95,16],[80,10],[73,20],[58,25],[48,30],[35,30],[28,36],[10,40],[-5,36]],af:[[-17,21],[-6,36],[10,37],[32,31],[43,12],[51,12],[40,-15],[32,-28],[20,-35],[12,-17],[9,4],[-8,5],[-17,14]],na:[[-168,66],[-140,70],[-95,72],[-60,60],[-55,48],[-80,25],[-97,18],[-85,10],[-105,20],[-125,40],[-135,58]],sa:[[-80,10],[-60,10],[-35,-7],[-48,-25],[-65,-55],[-75,-45],[-72,-20],[-80,-3]],au:[[114,-22],[130,-12],[142,-11],[153,-27],[146,-39],[132,-33],[115,-34]]};
const AL={};let mapOn=false;
function mapInit(){const c=$('#mp');if(!c)return;c.onclick=ev=>{const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*c.width,y=(ev.clientY-r.top)/r.height*c.height;let b=null,bd=26;for(const k in CL){const[px,py]=mxy(c,CL[k]),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;b=k}}if(b)open(b)}}
const mxy=(c,[lo,la])=>[(lo+180)/360*c.width,(80-la)/140*c.height];
function mapDraw(t){const c=$('#mp');if(!c||TAB!=='map')return;const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio,x=c.getContext('2d'),a=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#e6b34a';x.strokeStyle='#ffffff10';for(let i=-180;i<=180;i+=30){const[px]=mxy(c,[i,0]);x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke()}for(let j=-60;j<=80;j+=20){const[,py]=mxy(c,[0,j]);x.beginPath();x.moveTo(0,py);x.lineTo(w,py);x.stroke()}
 x.fillStyle='#ffffff14';x.strokeStyle='#ffffff30';for(const k in CO){x.beginPath();CO[k].forEach((p,i)=>{const[px,py]=mxy(c,p);i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fill();x.stroke()}
 x.font=12*devicePixelRatio+'px sans-serif';x.textAlign='center';for(const k in CL){const e=EN.get(k),on=Y>=e.y&&Y<=e.y2;AL[k]=(AL[k]||0)+((on?1:0)-(AL[k]||0))*.12;const al=AL[k];if(al<.03)continue;const[px,py]=mxy(c,CL[k]),r=(10+3*Math.sin(t/400+px))*devicePixelRatio;x.globalAlpha=al;const g=x.createRadialGradient(px,py,0,px,py,r*2.4);g.addColorStop(0,a);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(px,py,r*2.4,0,7);x.fill();x.fillStyle='#fff';x.fillText(e.n.slice(0,16),px,py-r*1.6);x.globalAlpha=1}}
/* ===== tape (time travel) ===== */
const tp=$('#tp');let drag=false;
function drawTape(){const w=tp.width=tp.clientWidth*devicePixelRatio,h=tp.height=tp.clientHeight*devicePixelRatio,x=tp.getContext('2d'),d=devicePixelRatio,a=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#e6b34a',X=p=>w-(p*(w-30*d)+15*d);
 const g=x.createLinearGradient(w,0,0,0);ERAS.forEach((e,i)=>g.addColorStop(Math.min(1,y2p(i?ERAS[i-1][0]:-3500)),e[2]));x.fillStyle=g;x.fillRect(0,h*.5-2*d,w,4*d);x.font=11*d+'px sans-serif';x.textAlign='center';x.fillStyle='#a79f90';
 for(const[y]of AN.slice(0,-1).concat([[2200]]))if(y!=2200||1){const px=X(y2p(y));x.fillRect(px,h*.5-6*d,1,12*d);x.fillText(fy(y),px,h*.5+22*d)}
 for(const e of EN.values())if(e.t=='e'){x.fillStyle=ES.has(e.id)?a:'#ffffff80';x.beginPath();x.arc(X(y2p(e.y)),h*.5-14*d,3*d,0,7);x.fill()}
 const px=X(P);x.fillStyle=a;x.fillRect(px-1.5*d,6*d,3*d,h-12*d);x.beginPath();x.arc(px,h*.5,7*d,0,7);x.fill()}
function tapeSet(ev){const r=tp.getBoundingClientRect(),p=1-Math.min(1,Math.max(0,(ev.clientX-r.left-15)/(r.width-30)));P=p;setYear(p2y(p),true)}
tp.onpointerdown=ev=>{drag=true;tp.setPointerCapture(ev.pointerId);tapeSet(ev)};tp.onpointermove=ev=>{if(drag)tapeSet(ev)};tp.onpointerup=()=>drag=false;
tp.onwheel=ev=>{ev.preventDefault();P=Math.min(1,Math.max(0,P+(ev.deltaY>0?.006:-.006)));setYear(p2y(P),true)};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowLeft'){P=Math.min(1,P+.005);setYear(p2y(P),true)}if(e.key=='ArrowRight'){P=Math.max(0,P-.005);setYear(p2y(P),true)}if(e.key=='Escape')$('#dw').classList.remove('o')});
function tween(to,ms){const f=Y,t0=performance.now();(function s(n){const k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);setYear(f+(to-f)*e);if(k<1)requestAnimationFrame(s)})(t0)}
/* ===== progression ===== */
function meter(){const tot=EN.size,n=ES.size,pc=Math.round(n/tot*100),lv=pc<25?'زائر':pc<50?'مستكشف':pc<80?'مؤرّخ':'سيّد الزمن';$('#ex').innerHTML=`<div class="tg">TIME EXPLORER · ${lv}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="tg">${pc}%</div>`}
const cnt=t=>[...ES].filter(i=>EN.get(i)&&EN.get(i).t==t).length;
/* ===== actions ===== */
const ACT={o:id=>open(id),x(){$('#dw').classList.remove('o')},t:k=>tab(k),jy(y){$('#dw').classList.remove('o');tab('map');tween(+y,1400)},clue(){if(mc<5){mc++;tab('my')}},nm(){mi=(mi+1)%MY.length;mc=1;mdone=false;tab('my')},

 snd(){AU.on=!AU.on;try{localStorage.setItem('chronos-snd',AU.on?'1':'0')}catch(e){}$('#snd').textContent=AU.on?'🔔':'🔕';if(AU.on)AU.click()},

document.addEventListener('click',e=>{if(e.target.closest('button,.ch,.it,[data-a]'))AU.click();const a=e.target.closest('[data-a]');if(a){const[f,...p]=a.dataset.a.split(':');try{ACT[f]&&ACT[f](p.join(':'))}catch(x){console.error(x)}$('#sr').style.display='none'}else if(!e.target.closest('#sw'))$('#sr').style.display='none'});
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>{const r=search(e.target.value),s=$('#sr');s.innerHTML=r.map(row).join('')||'<div class="it tg">لا نتائج</div>';s.style.display=e.target.value.trim()?'block':'none'},120)};

/* ===== particles ===== */
const fx=$('#fx'),fc=fx.getContext('2d'),PT=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),v:.0002+Math.random()*.0004,r:Math.random()*1.6+.4})),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(t){requestAnimationFrame(loop);fx.width=innerWidth;fx.height=innerHeight;if(!RM){fc.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#e6b34a';fc.globalAlpha=.35;for(const p of PT){p.y-=p.v;if(p.y<0)p.y=1;fc.beginPath();fc.arc(p.x*fx.width,p.y*fx.height,p.r,0,7);fc.fill()}}try{mapDraw(t)}catch(e){}})(0);
